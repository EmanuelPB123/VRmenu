<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

<a-scene>
    <a-assets>
        <video id="camera-feed" autoplay playsinline>

                <!-- Tubo fijo en el espacio, con id para controlarlo -->
    <a-cylinder id="measurement-cylinder" position="0 1 -3" radius="0.5" height="2" color="red" shadow>
    </a-cylinder>

    <!-- Cámara normal con plano de fondo -->
    <a-entity id="rig" position="0 1.6 0">
        <a-entity id="camera" camera look-controls>
            <a-plane id="background-plane" position="0 0 -5" width="16" height="9"
                material="src: #camera-feed; transparent: true; opacity: 1; side: double">
            </a-plane>
        </a-entity>
    </a-entity>
    
        </video>
    </a-assets>



    <!-- Panel de control mejorado -->
    <div style="position: absolute; bottom: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; color: white; display: flex; flex-direction: column; gap: 10px;">
        <div id="camera-controls">
            <button id="front-camera" style="margin-right: 5px;">Cámara Frontal</button>
            <button id="back-camera">Cámara Trasera</button>
        </div>
        
        <div id="position-controls">
            <div style="margin-bottom: 5px;">
                <label>Posición X: </label>
                <input type="range" id="pos-x" min="-5" max="5" step="0.1" value="0" style="width: 100px;">
                <span id="pos-x-value">0</span>
            </div>
            <div style="margin-bottom: 5px;">
                <label>Posición Y: </label>
                <input type="range" id="pos-y" min="0" max="3" step="0.1" value="1" style="width: 100px;">
                <span id="pos-y-value">1</span>
            </div>
            <div style="margin-bottom: 5px;">
                <label>Posición Z: </label>
                <input type="range" id="pos-z" min="-5" max="-1" step="0.1" value="-3" style="width: 100px;">
                <span id="pos-z-value">-3</span>
            </div>
        </div>
        
        <div id="size-controls">
            <div style="margin-bottom: 5px;">
                <label>Radio: </label>
                <input type="range" id="cylinder-radius" min="0.1" max="1.0" step="0.1" value="0.5" style="width: 100px;">
                <span id="radius-value">0.5</span>
            </div>
            <div>
                <label>Altura: </label>
                <input type="range" id="cylinder-height" min="0.5" max="4" step="0.1" value="2" style="width: 100px;">
                <span id="height-value">2</span>
            </div>
        </div>
        
        <button id="reset-button">Restablecer valores</button>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const backgroundPlane = document.getElementById('background-plane');
        const cylinder = document.getElementById('measurement-cylinder');
        const frontCameraButton = document.getElementById('front-camera');
        const backCameraButton = document.getElementById('back-camera');
        
        // Referencias a los controles de posición
        const posXSlider = document.getElementById('pos-x');
        const posYSlider = document.getElementById('pos-y');
        const posZSlider = document.getElementById('pos-z');
        const posXValue = document.getElementById('pos-x-value');
        const posYValue = document.getElementById('pos-y-value');
        const posZValue = document.getElementById('pos-z-value');
        
        // Referencias a los controles de tamaño
        const radiusSlider = document.getElementById('cylinder-radius');
        const heightSlider = document.getElementById('cylinder-height');
        const radiusValue = document.getElementById('radius-value');
        const heightValue = document.getElementById('height-value');
        
        // Botón de reset
        const resetButton = document.getElementById('reset-button');

        // Función para iniciar la cámara con la configuración especificada
        function startCamera(facingMode) {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: facingMode
                }
            })
            .then(stream => {
                // Detener cualquier stream existente
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }

                // Configurar el nuevo stream
                video.srcObject = stream;
                video.play();
            })
            .catch(error => {
                console.error('Error accediendo a la cámara:', error);
            });
        }

        // Configurar los controles de posición
        posXSlider.addEventListener('input', function() {
            cylinder.setAttribute('position', {
                x: parseFloat(this.value),
                y: parseFloat(posYSlider.value),
                z: parseFloat(posZSlider.value)
            });
            posXValue.textContent = this.value;
        });
        
        posYSlider.addEventListener('input', function() {
            cylinder.setAttribute('position', {
                x: parseFloat(posXSlider.value),
                y: parseFloat(this.value),
                z: parseFloat(posZSlider.value)
            });
            posYValue.textContent = this.value;
        });
        
        posZSlider.addEventListener('input', function() {
            cylinder.setAttribute('position', {
                x: parseFloat(posXSlider.value),
                y: parseFloat(posYSlider.value),
                z: parseFloat(this.value)
            });
            posZValue.textContent = this.value;
        });
        
        // Configurar los controles de tamaño
        radiusSlider.addEventListener('input', function() {
            cylinder.setAttribute('radius', parseFloat(this.value));
            radiusValue.textContent = this.value;
        });
        
        heightSlider.addEventListener('input', function() {
            cylinder.setAttribute('height', parseFloat(this.value));
            heightValue.textContent = this.value;
        });
        
        // Configurar botón de reset
        resetButton.addEventListener('click', function() {
            // Restablecer posiciones
            posXSlider.value = 0;
            posYSlider.value = 1;
            posZSlider.value = -3;
            posXValue.textContent = "0";
            posYValue.textContent = "1";
            posZValue.textContent = "-3";
            
            // Restablecer tamaños
            radiusSlider.value = 0.5;
            heightSlider.value = 2;
            radiusValue.textContent = "0.5";
            heightValue.textContent = "2";
            
            // Aplicar valores al cilindro
            cylinder.setAttribute('position', {x: 0, y: 1, z: -3});
            cylinder.setAttribute('radius', 0.5);
            cylinder.setAttribute('height', 2);
        });

        // Configurar los botones de selección de cámara
        frontCameraButton.addEventListener('click', () => {
            startCamera('user'); // Cámara frontal
        });

        backCameraButton.addEventListener('click', () => {
            startCamera('environment'); // Cámara trasera
        });

        // Iniciar con la cámara trasera por defecto
        startCamera('environment');
    </script>
</a-scene>
