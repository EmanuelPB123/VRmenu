<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

<a-scene>
  <a-assets>
    <video id="camera" autoplay playsinline></video>
  </a-assets>
  
  <!-- Crear una entidad cámara personalizada -->
  <a-entity id="rig" position="0 1.6 0">
    <a-entity id="camera" camera look-controls>
      <!-- Plano anclado a la cámara que siempre está frente al usuario -->
      <a-plane id="background-plane"
        position="0 0 -1" 
        material="src: #camera; transparent: true; opacity: 1; side: double">
      </a-plane>
    </a-entity>
  </a-entity>
  
  <script>
    const video = document.getElementById('camera');
    const backgroundPlane = document.getElementById('background-plane');
    
    // Solicitar acceso a la cámara
    navigator.mediaDevices.getUserMedia({video: true})
      .then(stream => {
        video.srcObject = stream;
        video.play();
        
        // Ajustar el tamaño del plano basado en las dimensiones del video y la distancia
        video.onloadedmetadata = function() {
          const videoAspect = video.videoWidth / video.videoHeight;
          const distance = 1; // Distancia del plano a la cámara
          
          // Calcula el tamaño del plano para que coincida con el campo de visión
          const vFOV = 75 * Math.PI / 180; // Campo de visión vertical en radianes (por defecto 75 grados)
          const height = 2 * Math.tan(vFOV / 2) * distance;
          const width = height * videoAspect;
          
          // Aplicar dimensiones al plano
          backgroundPlane.setAttribute('width', width);
          backgroundPlane.setAttribute('height', height);
        };
      })
      .catch(error => {
        console.error('Error accediendo a la cámara:', error);
      });
      
    // Ajustar el tamaño del plano cuando cambia el tamaño de la ventana
    window.addEventListener('resize', function() {
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl.camera) {
        const camera = sceneEl.camera;
        const distance = 1;
        const height = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * distance;
        const width = height * (window.innerWidth / window.innerHeight);
        
        backgroundPlane.setAttribute('width', width);
        backgroundPlane.setAttribute('height', height);
      }
    });
  </script>
</a-scene>
